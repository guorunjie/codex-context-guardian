name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Smoke test packed CLI
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TEST_DIR="$(mktemp -d)"
          npm install --prefix "$TEST_DIR" "$PWD/$TARBALL"
          "$TEST_DIR/node_modules/.bin/relay-baton" --help
          DEMO_DIR="$(mktemp -d)"
          "$TEST_DIR/node_modules/.bin/relay-baton" demo --output "$DEMO_DIR" --json
          "$TEST_DIR/node_modules/.bin/relay-baton" audit "$DEMO_DIR" --json
