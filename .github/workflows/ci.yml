name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Install SQLite on macOS
        if: runner.os == 'macOS'
        run: command -v sqlite3 || brew install sqlite
      - name: Install SQLite on Windows
        if: runner.os == 'Windows'
        run: choco install sqlite -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - run: npm pack --dry-run
      - run: npm run publish:dry-run
      - name: Smoke test packed CLI
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          TEST_DIR="$(mktemp -d)"
          npm install --prefix "$TEST_DIR" "$PWD/$TARBALL"
          node "$TEST_DIR/node_modules/codex-relay-baton-guardian/bin/relay-baton.js" --help
          DEMO_DIR="$(mktemp -d)"
          node "$TEST_DIR/node_modules/codex-relay-baton-guardian/bin/relay-baton.js" demo --output "$DEMO_DIR" --json
          node "$TEST_DIR/node_modules/codex-relay-baton-guardian/bin/relay-baton.js" audit "$DEMO_DIR" --json
